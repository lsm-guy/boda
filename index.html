<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Edu y Ana · Álbum de la boda</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#faf7f2">
<style>
  /* Altura de la franja azul que Google inyecta sobre la app.
     Si asomara un trozo, sube este valor unos pixeles. */
  :root { --aviso: 40px; }

  html, body {
    margin: 0; padding: 0; height: 100%;
    overflow: hidden;
    background: #faf7f2;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }

  /* Mensaje de fondo: queda tapado por el iframe cuando la app carga.
     Si el navegador bloquea el iframe, es lo que ve el invitado. */
  .respaldo {
    position: fixed; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    text-align: center; padding: 24px;
    color: #2f2a26;
  }
  .respaldo p { color: rgba(47,42,38,.6); font-size: 15px; margin: 0 0 18px }
  .respaldo a {
    color: #fff; background: #8a9a7b; text-decoration: none;
    padding: 14px 22px; border-radius: 12px; font-weight: 600; font-size: 15px;
  }

  /* La ventana recortada: el iframe se sube --aviso pixeles y la franja
     de Google queda fuera del area visible. */
  .marco { position: fixed; inset: 0; overflow: hidden; }
  .marco iframe {
    position: absolute;
    top: calc(var(--aviso) * -1);
    left: 0;
    width: 100%;
    height: calc(100% + var(--aviso));
    border: 0;
    display: block;
  }
</style>
</head>
<body>

  <div class="respaldo">
    <p>Cargando el álbum de la boda…</p>
    <a href="https://script.google.com/macros/s/AKfycbzVUZbPH4vFUDw0H2j7PpCln5uyHFRooD7hDxUkx157lHTz9WAx3ZtDXfVRzLQd1u71/exec">Abrir el álbum</a>
  </div>

  <div class="marco">
    <iframe
      src="https://script.google.com/macros/s/AKfycbzVUZbPH4vFUDw0H2j7PpCln5uyHFRooD7hDxUkx157lHTz9WAx3ZtDXfVRzLQd1u71/exec"
      title="Álbum de fotos de la boda de Edu y Ana"
      allow="camera; clipboard-write"></iframe>
  </div>

</body>
</html>
